name: Build
# Build the marketing site on every push/PR so breakage is caught before it
# reaches the Pages deploy. The lint workflow covers the skills validation and
# the docs-drift check; this one covers the astro build. (No `astro check` gate:
# the site is on the TypeScript 7 native compiler, which astro-check does not
# support yet — the build itself catches real breakage.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: this workflow only reads the repo

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes an in-flight build

defaults:
  run:
    working-directory: packages/products/website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: pnpm
          cache-dependency-path: packages/products/website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm build
      - name: Confirm the site built
        run: test -f dist/index.html
