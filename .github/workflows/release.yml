name: Release
# Push an annotated version tag (e.g. v1.2) to cut a GitHub Release. The changelog
# goes in the tag message: git tag -a v1.2 -m "## Changes…"; git push origin v1.2
# The release attaches the three operator-playbook PDFs (kept in sync with their
# sources by the docs-drift check in the lint/build workflows).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # least privilege: only needs to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish midway

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the annotated tag object for the release notes
          persist-credentials: false

      - name: Confirm the shipped PDFs are present
        run: test -f docs/pr-review.pdf && test -f docs/sec-audit.pdf && test -f docs/trp.pdf

      - name: Release notes from the tag message
        id: notes
        run: |
          # actions/checkout fetches the triggering tag as a lightweight ref, so
          # %(contents) would fall back to the commit message. Re-fetch the annotated
          # tag object to read its actual message.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          # subject + body excludes any signature block that %(contents) would include.
          NOTES="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")"
          [ -n "$NOTES" ] || NOTES="Release ${GITHUB_REF_NAME#v}"
          { echo "notes<<TTT_EOF"; echo "$NOTES"; echo "TTT_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create the release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            docs/pr-review.pdf
            docs/sec-audit.pdf
            docs/trp.pdf
