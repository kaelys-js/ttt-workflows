# git-cliff configuration — generates a release's CHANGELOG section from the Conventional Commits
# since the last tag. Driven by `scripts/release-draft.mjs` (run `pnpm release:notes <version>`),
# not by CI: the maintainer reviews the drafted section, then commits + tags. The output matches
# the Keep a Changelog style of CHANGELOG.md (a `## [x.y.z] - date` heading with grouped bullets);
# the draft script adds the link-reference definition.

[changelog]
# Only the version section — CHANGELOG.md already has its own top-of-file header.
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{%- endfor %}
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Only user-facing types reach the changelog; release plumbing (chore/ci/test/style/build) is
# dropped. Ordered so Features lead, then Fixes, then the rest.
commit_parsers = [
	{ message = "^feat", group = "<!-- 0 -->Features" },
	{ message = "^fix", group = "<!-- 1 -->Bug Fixes" },
	{ message = "^perf", group = "<!-- 2 -->Performance" },
	{ message = "^docs", group = "<!-- 3 -->Documentation" },
	{ message = "^refactor", group = "<!-- 4 -->Refactor" },
	{ message = "^revert", group = "<!-- 5 -->Reverts" },
	{ message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
