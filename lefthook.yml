# Git hooks for ttt-skills. Install once:  ./bin/mise exec -- lefthook install
#
# Every pre-push stage runs through turbo (`turbo run qa:<name>`) so unchanged inputs are a
# cache hit locally and in CI (see turbo.json + package.json qa:* scripts). Tools resolve via
# ./bin/mise exec, so a collaborator with only ./bin/mise (no host mise) still passes.
#
# GATES ARE UNSKIPPABLE. bin/git refuses `git push --no-verify`; the no-bypass stage refuses
# the LEFTHOOK=0 / LEFTHOOK_EXCLUDE envs. If a gate fails, fix the check — never skip it.

# ─── Pre-Commit ──────────────────────────────────────────────────────────────
pre-commit:
  parallel: false
  commands:
    no-bypass:
      priority: 1
      run: |
        if [ -n "${LEFTHOOK_EXCLUDE:-}" ] || [ "${LEFTHOOK:-}" = "0" ]; then
          echo "BLOCKED: lefthook gates are unskippable (LEFTHOOK/LEFTHOOK_EXCLUDE set)."; exit 1
        fi
    format-js:
      priority: 2
      glob: '*.{js,mjs,ts,tsx,json}'
      run: ./bin/mise exec -- oxfmt --write {staged_files} && git add {staged_files}
    format-sh:
      priority: 3
      glob: '*.sh'
      run: ./bin/mise exec -- shfmt -w {staged_files} && git add {staged_files}
    validate-skills:
      priority: 4
      run: ./bin/mise exec -- node scripts/validate-skills.mjs
    # Propagate plugin.json's version into the marketplace manifest, every SKILL.md, and VERSION so
    # a bump in one place can never drift; re-stage anything it rewrote so the commit stays in sync.
    # (CHANGELOG.md is curated, so it is verified, not rewritten — a missing section fails here.)
    version-sync:
      priority: 5
      run: ./bin/mise exec -- node scripts/sync-version.mjs && git add .claude-plugin/marketplace.json plugins/ttt-workflows/skills/*/SKILL.md VERSION

# ─── Pre-Push: the full format + lint + test gate, each stage cached by turbo ──
pre-push:
  parallel: false
  commands:
    # Gates are unskippable. bin/git refuses `git push --no-verify`; this refuses the
    # LEFTHOOK=0 / LEFTHOOK_EXCLUDE env bypasses (which act at lefthook's own hook wrapper).
    no-bypass:
      priority: 1
      run: |
        if [ -n "${LEFTHOOK_EXCLUDE:-}" ] || [ "${LEFTHOOK:-}" = "0" ]; then
          echo "BLOCKED: lefthook gates are unskippable (LEFTHOOK/LEFTHOOK_EXCLUDE set)."; exit 1
        fi
    # Enforce CI == lefthook parity and that no test input is hidden by .gitignore.
    preflight:
      priority: 1
      run: ./bin/preflight.sh
    format:
      priority: 2
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:format
    lint:
      priority: 3
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:lint
    shell-format:
      priority: 4
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:shell-format
    shell-lint:
      priority: 5
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:shell-lint
    toml:
      priority: 6
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:toml
    validate-skills:
      priority: 7
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:validate-skills
    version-sync:
      priority: 7
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:version-sync
    scripts-test:
      priority: 7
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:scripts-test
    docs-check:
      priority: 8
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:docs-check
    web-format:
      priority: 9
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-format
    web-lint:
      priority: 10
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-lint
    web-typecheck:
      priority: 10
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-typecheck
    astro-format:
      priority: 11
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:astro-format
    css-lint:
      priority: 12
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:css-lint
    yaml-lint:
      priority: 13
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:yaml-lint
    workflow-lint:
      priority: 14
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:workflow-lint
    markdown-lint:
      priority: 15
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:markdown-lint
    web-test:
      priority: 16
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-test
    # Website E2E + visual regression in the pinned Playwright container. Runs locally via
    # Docker; in CI it defers to the web-e2e.yml container job to avoid a double run.
    web-e2e:
      priority: 17
      run: |
        if [ -n "${CI:-}" ]; then
          echo "web-e2e: deferred to the web-e2e.yml container job."
        elif docker info >/dev/null 2>&1; then
          ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-e2e
        else
          echo "web-e2e: Docker unavailable here — this check runs in the web-e2e.yml CI job."
        fi

# ─── Commit Message ──────────────────────────────────────────────────────────
commit-msg:
  parallel: false
  commands:
    attribution:
      priority: 1
      run: |
        if grep -iqE 'co-authored-by|generated with|noreply@anthropic\.com|🤖' {1}; then
          echo "AI attribution found in commit message — remove it."; exit 1
        fi
    commitlint:
      priority: 2
      run: ./bin/mise exec -- commitlint --edit {1}

# ─── Post-Checkout / Post-Merge ──────────────────────────────────────────────
post-merge:
  commands:
    tools:
      run: ./bin/mise install
post-checkout:
  commands:
    tools:
      run: ./bin/mise install
